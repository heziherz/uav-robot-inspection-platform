spring.application.name=device-simulator

# ---------- Kafka connection ----------
spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.consumer.group-id=device-simulator-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false

# ---------- Kafka producer (capacity-test knobs) ----------
# The values below are exactly the kafka-clients defaults, so nothing changes
# for normal runs. They are written out explicitly so that experiment E can
# flip them (linger.ms / compression) and show the throughput difference.
spring.kafka.producer.linger.ms=0
spring.kafka.producer.batch.size=16384
spring.kafka.producer.compression-type=none
spring.kafka.producer.acks=all

# ---------- Platform access (device requests upload authorization) ----------
# Devices go through the Nginx gateway (port 8080 is only exposed inside the
# docker network). The gateway proxies /api to platform-service.
platform.base-url=http://localhost/api

# ---------- Device channel authentication (HMAC token) ----------
# Pre-shared secret; MUST be identical to the platform side.
device.token.secret=uav-platform-device-secret-2026-a7f3c9e1b4d6

# ---------- HDFS (device uploads images itself) ----------
# The simulator runs on the host, so it reaches HDFS through the mapped port.
# Images are uploaded BY THE DEVICE; the platform never moves files.
hdfs.webhdfs-base=http://localhost:9870

# ---------- Device scale (capacity-test knobs) ----------
# Defaults reproduce the original behaviour: 3 drones + 3 robot dogs.
sim.device.drone-count=3
sim.device.dog-count=3

# 0 = auto (= max(4, CPU cores)).
# This pool is SHARED by all devices, so the thread count stays constant
# no matter how many devices are simulated.
sim.device.scheduler-threads=0

# true = log the full JSON payload of every message (needed for demos).
# Set to false for load tests: at 500 devices this is ~430 synchronous
# log lines per second, which alone can become the bottleneck.
sim.device.log-payload=true

# true = really write placeholder image files to disk.
# Set to false to isolate the message pipeline from disk IO
# (side effect: media upload to HDFS will fail - expected).
sim.device.write-media-files=true
