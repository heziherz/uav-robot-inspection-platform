server.port=8080
spring.application.name=platform-service

# ---------- MongoDB ----------
# NOTE: Spring Boot 4 renamed the prefix: spring.data.mongodb.* -> spring.mongodb.*
# Local dev default. In Docker, overridden by env SPRING_MONGODB_URI
spring.mongodb.uri=mongodb://localhost:27017/uav_platform

# ---------- Kafka ----------
# Local dev default. In Docker, overridden by env SPRING_KAFKA_BOOTSTRAP_SERVERS
spring.kafka.bootstrap-servers=localhost:19092
spring.kafka.consumer.group-id=platform-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.listener.missing-topics-fatal=false

# ---------- Elasticsearch ----------
# Local dev default. In Docker, overridden by env ES_BASE_URL (relaxed binding)
es.base-url=http://localhost:9200

# ---------- Simulator image directory ----------
# Empty (local mode) = use the absolute path carried by the Kafka message.
# In Docker, overridden by env SIM_FILES_DIR=/app/sim-files
sim.files.dir=

# ---------- HDFS (WebHDFS) ----------
# Local dev default; in Docker overridden by env HDFS_WEBHDFS_BASE
hdfs.webhdfs-base=http://localhost:9870
