server.port=8080
spring.application.name=platform-service
# ---------- MongoDB ----------
spring.mongodb.uri=mongodb://localhost:27017/uav_platform
# ---------- Kafka ----------
spring.kafka.bootstrap-servers=localhost:9092
# Consumer group MUST differ from device-simulator (otherwise they compete for messages)
spring.kafka.consumer.group-id=platform-service-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# Allow subscribing to topics that do not exist yet (dev-friendly)
spring.kafka.listener.missing-topics-fatal=false

