spring:
  application:
    name: heartbeat-demo
  data:
    mongodb:
      uri: mongodb://localhost:27017/uav_platform   # 第 3 步：连本机 Docker 的 MongoDB（库名 uav_platform）
  kafka:
    bootstrap-servers: localhost:9092        # 连本机 Docker 的 Kafka
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: heartbeat-demo-group
      auto-offset-reset: earliest            # 从最早开始读（便于演示看到积压消息）
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

server:
  port: 8080                                 # 仅为了让应用常驻，先不管它

logging:
  level:
    root: info
