# ============================================================
# 无人机-机器狗空地协同巡检集成平台 —— Nginx 网关配置
# 职责：
#   ① 托管前端静态文件（React 构建产物）
#   ② /api 反向代理到后端业务服务集群（第 7.2 步加入多实例负载均衡）
# ============================================================

# 后端服务集群
#   现在（7.1）：后端跑在宿主机 IDEA 里 → 用 host.docker.internal 访问宿主机
#   第 7.2 步容器化后改成服务名，例如：
#     server platform-service-1:8080;
#     server platform-service-2:8080;
upstream backend_cluster {
    server platform-service:8080;
}

server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------- 前端静态资源（SPA：找不到的路径回退到 index.html） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
