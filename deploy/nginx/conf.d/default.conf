# ============================================================
# 无人机-机器狗空地协同巡检集成平台 —— Nginx 网关配置
# 职责：
#   ① 托管前端静态文件（React 构建产物）
#   ② /api 反向代理到后端业务服务集群（2 实例轮询）
# ============================================================

# 后端服务集群
#   两个实例由 docker-compose 定义（platform-service-1 / platform-service-2）。
#   ⚠ Nginx 在【启动时】解析这里的主机名，因此 compose 中 nginx 必须
#     depends_on 这两个服务，否则会因解析不到而启动失败。
#   默认策略为【轮询】——请求依次分发到两个实例。
upstream backend_cluster {
    server platform-service-1:8080;
    server platform-service-2:8080;
}

server {
    listen       80;
    server_name  localhost;

    root   /usr/share/nginx/html;
    index  index.html;

    # ---------- 前端静态资源（SPA：找不到的路径回退到 index.html） ----------
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---------- 后端 API 反向代理 ----------
    location /api/ {
        proxy_pass http://backend_cluster;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 回传实际处理请求的后端实例地址 —— 用于验证负载均衡是否生效
        #   连续请求并观察该响应头，应在两个实例之间交替
        add_header X-Upstream $upstream_addr always;
    }
}
