# ============================================================
# 无人机-机器狗空地协同巡检集成平台 —— 中间件集群编排
# 用法: cd deploy && docker compose up -d
# 镜像版本均已固定，避免组件版本兼容问题（课程风险对策）
# 单机 Docker 模拟多节点（HDFS 拆 NN/DN 两容器）
# ============================================================

services:
  # ---------- 1) 分布式文件系统 HDFS (NameNode + DataNode) ----------
  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-namenode
    restart: unless-stopped
    environment:
      - CLUSTER_NAME=cluster1
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
    ports:
      - "9870:9870"     # HDFS WebUI（浏览器看）
      - "9000:8020"     # 外部程序访问 hdfs://localhost:9000
    volumes:
      - hdfs-namenode:/hadoop/dfs/name

  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-datanode
    restart: unless-stopped
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - SERVICE_PRECONDITION=hadoop-namenode:9870
    depends_on:
      - hadoop-namenode
    ports:
      - "9864:9864"     # DataNode WebUI
    volumes:
      - hdfs-datanode:/hadoop/dfs/data

  # ---------- 2) 分布式数据库 MongoDB ----------
  mongodb:
    image: mongo:7.0
    container_name: mongodb
    restart: unless-stopped
    command: mongod --wiredTigerCacheSizeGB 0.5
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 3) 消息中间件 Kafka (KRaft 单节点, 免 Zookeeper) ----------
  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ---------- 4) 检索分析 Elasticsearch + Kibana (关闭 xpack 安全, 便于演示) ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:8.13.4
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN
    depends_on:
      - elasticsearch
    mem_limit: 1g
    ports:
      - "5601:5601"

  # ---------- 5) 负载均衡 / 网关 Nginx ----------
  nginx:
    image: nginx:1.27-alpine
    container_name: nginx-gateway
    restart: unless-stopped
    ports:
      - "80:80"     # 统一对外入口（先默认页，后面挂后端/前端）
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro   # 后续反向代理配置放这里
      - ./nginx/html:/usr/share/nginx/html:ro # 静态文件/前端构建产物放这里

# ---------- 数据卷（Docker 管理，删除容器不丢数据） ----------
volumes:
  hdfs-namenode:
  hdfs-datanode:
  mongodb-data:
  kafka-data:
  es-data:
