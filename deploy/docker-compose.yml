# ============================================================
# 无人机-机器狗空地协同巡检集成平台 —— 中间件集群编排
# 用法: cd deploy && docker compose up -d
# 镜像版本均已固定，避免组件版本兼容问题（课程风险对策）
# 单机 Docker 模拟多节点（HDFS 拆 NN/DN 两容器）
# ============================================================

# ---------- 业务服务的公共配置（YAML 锚点，供两个实例复用）----------
# container_name 不能写在这里 —— 两个服务取同一个名字会冲突。
x-platform-service: &platform-service
  build:
    context: ../backend/platform-service
    dockerfile: Dockerfile
  restart: unless-stopped
  depends_on:
    - mongodb
    - kafka
    - elasticsearch
  environment:
    # 用 Spring Boot 标准环境变量名（宽松绑定直接覆盖配置，不依赖占位符解析）
    SPRING_MONGODB_URI: mongodb://mongodb:27017/uav_platform
    SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ES_BASE_URL: http://elasticsearch:9200
    # 平台侧只用 WebHDFS 读取影像；写入由设备自己完成（见 device-simulator 的 StorageClient）
    HDFS_WEBHDFS_BASE: http://hadoop-namenode:9870
  # 注意：这里【不再挂载 sim-files 目录】。
  #   改造前平台需要读设备生成的本地文件，靠绑定挂载制造出"共享文件系统"的假象；
  #   改造后影像由设备自己上传到 HDFS，消息中只传存储引用，平台无需访问设备文件系统。
  expose:
    - "8080"          # 注意：不映射到宿主机，避免和本地 IDEA 版的 8080 冲突

services:
  # ---------- 1) 分布式文件系统 HDFS (NameNode + DataNode) ----------
  hadoop-namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-namenode
    restart: unless-stopped
    environment:
      - CLUSTER_NAME=cluster1
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - HDFS_CONF_dfs_namenode_datanode_registration_ip___hostname___check=false
    ports:
      - "9870:9870"     # HDFS WebUI（浏览器看）
      - "9000:8020"     # 外部程序访问 hdfs://localhost:9000
    volumes:
      - hdfs-namenode:/hadoop/dfs/name

  hadoop-datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: hadoop-datanode
    restart: unless-stopped
    environment:
      - CORE_CONF_fs_defaultFS=hdfs://hadoop-namenode:8020
      - HDFS_CONF_dfs_replication=1
      - HDFS_CONF_dfs_permissions_enabled=false
      - SERVICE_PRECONDITION=hadoop-namenode:9870
    depends_on:
      - hadoop-namenode
    ports:
      - "9864:9864"     # DataNode WebUI
    volumes:
      - hdfs-datanode:/hadoop/dfs/data

  # ---------- 2) 分布式数据库 MongoDB ----------
  mongodb:
    image: mongo:8.3.9
    container_name: mongodb
    restart: unless-stopped
    command: mongod --wiredTigerCacheSizeGB 0.5
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
      # 首次启动自动初始化（时序集合 + 索引）；数据目录非空时不执行
      - ./init/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ---------- 3) 消息中间件 Kafka (KRaft 单节点, 免 Zookeeper) ----------
  kafka:
    image: apache/kafka:4.3.1
    container_name: kafka
    restart: unless-stopped
    ports:
      - "19092:19092"  # 宿主机程序（device-simulator）用这个
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # 双 listener：容器内用 kafka:9092，宿主机用 localhost:19092（解决"门牌号"问题）
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:19092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      # 自动创建 topic 时的默认分区数。
      # 分区数 = 消费并行度上限：单分区意味着单个 topic 只能被 1 个消费者消费。
      # 注意：此设置只对【新建】的 topic 生效，已存在的 topic 需用 --alter 调整。
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data

  # ---------- 4) 检索分析 Elasticsearch + Kibana (关闭 xpack 安全, 便于演示) ----------
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.3
    container_name: elasticsearch
    restart: unless-stopped
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms512m -Xmx512m
    mem_limit: 1g
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data

  kibana:
    image: docker.elastic.co/kibana/kibana:9.5.3
    container_name: kibana
    restart: unless-stopped
    environment:
      - ELASTICSEARCH_HOSTS=http://elasticsearch:9200
      - I18N_LOCALE=zh-CN
    depends_on:
      - elasticsearch
    mem_limit: 1g
    ports:
      - "5601:5601"

  # ---------- 6) 业务服务（2 实例，演示负载均衡）----------
  # 为什么能起多实例：服务是【无状态】的——
  #   · 认证用 JWT，服务端不存 session
  #   · 内存缓冲区各实例独立（Kafka 分区决定消息进哪个实例，数据不重叠）
  #   · 数据库 / ES / HDFS 客户端各自连接
  platform-service-1:
    <<: *platform-service
    container_name: platform-service-1

  platform-service-2:
    <<: *platform-service
    container_name: platform-service-2

  # ---------- 7) 设备仿真端（可选 profile：代表系统外部设备）----------
  # 【为什么用 profiles 而不是默认启动】
  #   仿真端代表【系统外部设备】（参与者 A4/A5），逻辑上不属于平台编排。
  #   默认 `docker compose up -d` **不含**它，以保持"设备在平台之外"的边界语义；
  #   演示 / 测试时用 `docker compose --profile sim up -d` 一并拉起。
  #
  # 【容器化后的地址变化】
  #   仿真端从"宿主机进程"变成"网络内容器"，因此连接地址从 localhost 换成服务名：
  #     Kafka      localhost:19092  →  kafka:9092
  #     HDFS       localhost:9870   →  hadoop-namenode:9870
  #     平台接口   localhost/api    →  nginx/api（仍经网关，保持"唯一入口"原则）
  device-simulator:
    build:
      context: ../backend/device-simulator
      dockerfile: Dockerfile
    container_name: device-simulator
    restart: unless-stopped
    profiles: ["sim"]
    depends_on:
      - kafka
      - nginx
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      HDFS_WEBHDFS_BASE: http://hadoop-namenode:9870
      PLATFORM_BASE_URL: http://nginx/api
      # 与平台侧一致的设备令牌密钥
      DEVICE_TOKEN_SECRET: uav-platform-device-secret-2026-a7f3c9e1b4d6

  # ---------- 5) 负载均衡 / 网关 Nginx ----------
  nginx:
    image: nginx:1.30-alpine
    container_name: nginx-gateway
    restart: unless-stopped
    # ⚠ Nginx 在【启动时】解析 upstream 中的主机名，解析不到会直接启动失败
    #   （nginx: [emerg] host not found in upstream "platform-service-1"）
    #   因此必须声明依赖，确保后端实例先创建。
    #   这也是 Nginx 开源版的已知限制：不支持运行时动态感知后端实例变化。
    depends_on:
      - platform-service-1
      - platform-service-2
    ports:
      - "80:80"     # 统一对外入口（先默认页，后面挂后端/前端）
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro          # 网关配置
      - ../frontend/dist:/usr/share/nginx/html:ro    # 前端构建产物（npm run build 生成）

# ---------- 数据卷（Docker 管理，删除容器不丢数据） ----------
volumes:
  hdfs-namenode:
  hdfs-datanode:
  mongodb-data:
  kafka-data:
  es-data:
